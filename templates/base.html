<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}E-Waste Recovery Intelligence{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="top">
        <a class="brand" href="{{ url_for('index') }}">♻️ E-Waste Recovery Intelligence</a>
    <nav aria-label="Main">
      <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Analyse a part</a>
      <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="foot">
    Values are indicative second-hand and scrap prices in rupees, meant as a guide rather than a quote.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
